name: "CodeQL"

on:
  push:
    branches:
      - 'main'
      - 'release/*'
      - 'support/*'
  pull_request:

# Write permissions are granted per job below; a job-level block replaces
# the workflow-level one, so nothing here would reach a job that has its own.
permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  analyze:
    name: Analyze
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      # Needed to upload the results to the code-scanning dashboard.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Setup Java JDK
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 17
        cache: 'maven'
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4.38.1
      with:
        languages: ${{ matrix.language }}
    - name: Autobuild
      uses: github/codeql-action/autobuild@v4.38.1
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4.38.1
      with:
        category: "/language:${{matrix.language}}"
