name: "CodeQL"

on:
  push:
    branches:
      - 'main'
      - 'release/*'
      - 'support/*'
  pull_request:

# Write permissions are granted per job below; a job-level block replaces
# the workflow-level one, so nothing here would reach a job that has its own.
permissions:
  contents: read

# Pull requests cancel superseded runs; pushes get unique groups so none is dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      # Read by the detect-changes action to list the pull request files.
      pull-requests: read
      # Needed to upload the results to the code-scanning dashboard.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Detect changes
      id: changes
      uses: ./.github/actions/detect-changes
    - name: Setup Java JDK
      if: steps.changes.outputs.code == 'true'
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 17
        cache: 'maven'
    - name: Initialize CodeQL
      if: steps.changes.outputs.code == 'true'
      uses: github/codeql-action/init@v4.38.3
      with:
        languages: ${{ matrix.language }}
    - name: Autobuild
      if: steps.changes.outputs.code == 'true'
      uses: github/codeql-action/autobuild@v4.38.3
    - name: Perform CodeQL Analysis
      if: steps.changes.outputs.code == 'true'
      uses: github/codeql-action/analyze@v4.38.3
      with:
        category: "/language:${{matrix.language}}"
